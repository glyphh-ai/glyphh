# The platform on Fly: the app glyphh-ai-app, at https://platform.glyphh.ai (the server's GLYPHH_PLATFORM_URL).
# Deployed only by CI, on a merge to main (.github/workflows/ci.yml). Its secrets are the app's own:
# PLATFORM_CLIENT_ID and PLATFORM_CLIENT_SECRET (its OAuth client at the server) and SESSION_SECRET.
# It also answers https://demo.glyphh.ai (server/demo.ts), with DEMO_GLYPHH_API_KEY. The demo keeps its ledger and
# limits in memory, so it assumes one machine (min_machines_running = 1). And https://games.glyphh.ai
# (server/games.ts): plain pages, no secrets.
app = "glyphh-ai-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  GLYPHH_SERVER_URL = "https://api.glyphh.ai"
  PLATFORM_URL = "https://platform.glyphh.ai"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
