# The platform on Fly: the app glyphh-ai-app, at https://platform.glyphh.ai (the server's GLYPHH_PLATFORM_URL).
# Deployed only by CI, on a merge to main (.github/workflows/ci.yml). Its secrets are the app's own:
# PLATFORM_CLIENT_ID and PLATFORM_CLIENT_SECRET (its OAuth client at the server) and SESSION_SECRET.
# One host only since Glyphh's products were retired (2026-11-18): demo.glyphh.ai and games.glyphh.ai are no longer
# served here (their certificates on this app, and the secrets DEMO_GLYPHH_API_KEY and DEMO_DAILY_CALLS, can go).
app = "glyphh-ai-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  GLYPHH_SERVER_URL = "https://api.glyphh.ai"
  PLATFORM_URL = "https://platform.glyphh.ai"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
