[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphh"
version = "2.6.7"
description = "Hyperdimensional Computing SDK and Runtime"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "Glyphh AI", email = "support@glyphh.ai"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The kernel (kernel/glyphh_kernel.py) needs numpy alone. The rest
# covers the reference substrate library (glyphh/) and its evals.
dependencies = [
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# Live-LLM evals (tests/autonomy) consult the Claude API
live = [
    "anthropic>=0.40.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.82.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.0.285",
]

[project.urls]
Homepage = "https://glyphh.ai"
Repository = "https://github.com/glyphh-ai/glyphh-runtime"
Documentation = "https://docs.glyphh.ai"

[tool.setuptools.packages.find]
# glyphh* — the substrate library; infrastructure/shared support it
include = ["glyphh*", "infrastructure*", "shared*", "capabilities*"]

[tool.setuptools.package-data]
"glyphh" = []
"glyphh.intent" = ["data/*.json", "data/*.jsonl", "data/packs/*.json"]
"glyphh.state" = ["data/*.json", "data/packs/*.json"]
"glyphh.memory" = ["lessons/*.jsonl"]
"capabilities" = ["**/*.json", "**/*.jsonl", "**/*.yaml"]
