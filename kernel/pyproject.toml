[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphh-kernel"
version = "1.0.0"
description = "An algebra of thought for AI: compose, compare and abstract meanings, and build graded judgment on top."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.urls]
Homepage = "https://glyphh.ai"
Repository = "https://github.com/glyphh-ai/ada"

[tool.setuptools]
py-modules = ["glyphh_kernel"]
