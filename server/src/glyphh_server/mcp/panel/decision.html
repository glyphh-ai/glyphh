<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ada decision</title>
<style>
:root{color-scheme:light dark}
body{margin:0;padding:16px;background:transparent;color:var(--color-text-primary,CanvasText);
  font-family:var(--font-sans,system-ui,sans-serif);font-size:var(--font-text-md-size,14px);line-height:var(--font-text-md-line-height,1.45)}
.top{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
h1{margin:0;font-size:var(--font-heading-sm-size,16px);font-weight:var(--font-weight-semibold,600)}
.sub{color:var(--color-text-secondary,GrayText);font-size:var(--font-text-sm-size,12px)}
.out{border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35));
  border-radius:var(--border-radius-lg,12px);padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.name{font-size:var(--font-text-sm-size,12px);color:var(--color-text-secondary,GrayText)}
.verdict{font-size:var(--font-heading-md-size,20px);font-weight:var(--font-weight-semibold,600);overflow-wrap:anywhere}
.chip{font-size:var(--font-text-sm-size,12px);padding:1px 8px;border-radius:999px;white-space:nowrap;
  border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35))}
.ask{border-color:var(--color-border-warning,#c98a00);color:var(--color-text-warning,inherit)}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:minmax(60px,30%) 1fr 3.5em;gap:8px;align-items:center;font-size:var(--font-text-sm-size,12px)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:6px;border-radius:3px;background:var(--color-background-secondary,rgba(128,128,128,.18));overflow:hidden}
.fill{height:100%;background:var(--color-text-secondary,GrayText)} .best .fill{background:var(--color-text-primary,CanvasText)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--color-text-secondary,GrayText);font-size:var(--font-text-sm-size,12px)}
details ul{margin:6px 0 0;padding-left:18px;font-size:var(--font-text-sm-size,12px)}
.teach{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.teach label{font-size:var(--font-text-sm-size,12px);color:var(--color-text-secondary,GrayText)}
input,select{font:inherit;padding:4px 8px;border-radius:var(--border-radius-md,8px);
  border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35));
  background:var(--color-background-primary,Canvas);color:inherit;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:5px 14px;border-radius:var(--border-radius-md,8px);cursor:pointer;
  border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35));
  background:var(--color-background-secondary,transparent);color:var(--color-text-primary,CanvasText)}
button.primary{background:var(--color-text-primary,CanvasText);color:var(--color-background-primary,Canvas);border-color:transparent}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--color-ring-primary,Highlight);outline-offset:2px}
.done{color:var(--color-text-success,inherit)} .bad{color:var(--color-text-danger,inherit)} [hidden]{display:none!important}
.empty{color:var(--color-text-secondary,GrayText)}
</style></head>
<body>
<div class="top"><h1 id="title">Ada decision</h1><span class="sub" id="meta"></span></div>
<p class="empty" id="waiting">Waiting for the decision.</p>
<div id="outs"></div>
<div class="row" id="actions" hidden>
  <button class="primary" id="approve">Approve</button>
  <button id="correct" hidden>Record the correction</button>
  <span class="sub" id="why"></span>
</div>
<p class="done" id="saved" hidden></p>
<p class="bad" id="error" hidden></p>
<script type="module">__APP_JS__</script>
<script type="module">
// One decision of an Ada model, from ada_decide or a template's decide tool (glyphh_bot_decide): the outcome, its
// probabilities, whether Ada asks a person first, and the precedents it stands on. Approve records the case with the
// outcome Ada chose; changing an output's outcome and recording the correction records it with yours. Either is a new
// precedent the model learns from, through the tool the answer names (structuredContent.teach).
const $ = (id) => document.getElementById(id);
const app = new window.McpApp({ name: "glyphh-decision", version: "1" }, {}, { autoResize: true });
const view = { input: null, answer: null, picks: {}, decided: {}, recorded: false };
const OTHER = "\u0000other";

function theme(ctx) {
  if (!ctx) return;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(ctx.styles?.variables || {})) if (v) root.style.setProperty(k, v);
  if (ctx.theme) root.style.colorScheme = ctx.theme;
  const fonts = ctx.styles?.css?.fonts;
  if (fonts && !$("host-fonts")) { const s = document.createElement("style"); s.id = "host-fonts"; s.textContent = fonts; document.head.append(s); }
}

function failed(message) { $("error").textContent = message; $("error").hidden = !message; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const pct = (p) => `${Math.round(100 * (p || 0))}%`;

// The outputs decided: {output name or "": its answer}. A single decision is one output, "".
function outputs(a) { return a.outputs ? a.outputs : { "": a }; }
// Only a single-valued outcome (a value, true/false) is taught here; a number or a list is shown, not taught.
const teachable = (d) => typeof d.outcome === "string";

function bars(d) {
  const box = el("div", "bars");
  const sorted = Object.entries(d.probabilities || {}).sort((a, b) => b[1] - a[1]).slice(0, 6);
  for (const [o, p] of sorted) {
    const row = el("div", "bar" + (o === d.outcome ? " best" : ""));
    const track = el("div", "track"); const fill = el("div", "fill"); fill.style.width = pct(p); track.append(fill);
    row.append(el("span", "", o), track, el("span", "", pct(p)));
    box.append(row);
  }
  return box;
}

function receipts(d) {
  const r = d.receipts || [];
  const box = el("details");
  box.append(el("summary", "", r.length ? `Stands on ${r.length} precedent${r.length === 1 ? "" : "s"}` : "No precedent close enough"));
  if (r.length) {
    const ul = el("ul");
    for (const x of r.slice(0, 8)) ul.append(el("li", "", `${x.outcome ?? "no outcome"} · ${pct(x.sim)} alike · ${x.id}`));
    box.append(ul);
  }
  return box;
}

function teach(name, d) {
  const box = el("div", "teach");
  const id = `pick-${name || "default"}`;
  const label = el("label", "", "Outcome"); label.htmlFor = id;
  const pick = el("select"); pick.id = id;
  for (const o of Object.keys(d.probabilities || {})) pick.append(new Option(o, o));
  if (![...pick.options].some((x) => x.value === d.outcome)) pick.prepend(new Option(d.outcome, d.outcome));
  pick.append(new Option("Something else…", OTHER));
  pick.value = d.outcome;
  const other = el("input"); other.placeholder = "What it should be"; other.hidden = true; other.setAttribute("aria-label", "What it should be");
  const changed = () => {
    other.hidden = pick.value !== OTHER;
    view.picks[name] = pick.value === OTHER ? other.value.trim() : pick.value;
    sync();
  };
  pick.onchange = () => { changed(); if (!other.hidden) other.focus(); };
  other.oninput = changed;
  view.picks[name] = d.outcome; view.decided[name] = d.outcome;
  box.append(label, pick, other);
  return box;
}

function show() {
  const a = view.answer;
  if (!a) return;
  $("waiting").hidden = true;
  $("title").textContent = a.model ? `Ada decision · ${a.model}` : "Ada decision";
  $("meta").textContent = a.version != null ? `version ${a.version}` : "";
  view.picks = {}; view.decided = {};
  const outs = outputs(a);
  const cards = Object.entries(outs).map(([name, d]) => {
    const c = el("div", "out");
    const head = el("div", "head");
    const left = el("div");
    if (name) left.append(el("div", "name", name));
    const shown = d.outcome == null ? "No answer yet" : Array.isArray(d.outcome) ? d.outcome.join(", ") || "none" : String(d.outcome);
    left.append(el("div", "verdict", shown));
    head.append(left);
    const chips = el("div", "row");
    const p = d.probabilities?.[d.outcome];
    if (p != null) chips.append(el("span", "chip", pct(p)));
    if (d.ask) chips.append(el("span", "chip ask", "Asks you first"));
    head.append(chips);
    c.append(head);
    if (Object.keys(d.probabilities || {}).length > 1) c.append(bars(d));
    c.append(receipts(d));
    if (teachable(d) && a.teach) c.append(teach(name, d));
    return c;
  });
  $("outs").replaceChildren(...cards);
  sync();
}

function sync() {
  const a = view.answer;
  const can = !!(a?.teach && view.input?.data && Object.keys(view.picks).length);
  $("actions").hidden = !(a?.teach && Object.keys(view.picks).length);
  const changed = Object.keys(view.picks).some((n) => view.picks[n] !== view.decided[n]);
  const blank = Object.values(view.picks).some((v) => !v);
  $("approve").hidden = changed; $("correct").hidden = !changed;
  $("approve").disabled = !can || view.recorded; $("correct").disabled = !can || view.recorded || blank;
  $("why").textContent = view.recorded ? "" : !view.input?.data ? "Waiting for the case." : changed ? "Records the case with your outcome." : "Records the case with this outcome.";
  document.querySelectorAll("select,input").forEach((x) => { x.disabled = view.recorded; });
}

async function record() {
  const a = view.answer;
  const args = { ...a.teach.args, data: view.input.data };
  const named = Object.keys(view.picks).filter((n) => n);
  if (named.length) args.outcomes = Object.fromEntries(named.map((n) => [n, view.picks[n]]));
  else args.outcome = view.picks[""];
  view.recorded = true; sync(); failed("");
  try {
    const r = await app.callServerTool({ name: a.teach.tool, arguments: args });
    if (r?.isError) throw new Error(r.structuredContent?.error?.message || r.content?.[0]?.text || "Recording failed.");
    const said = r?.content?.[0]?.text || "Recorded.";
    const corrected = Object.keys(view.picks).filter((n) => view.picks[n] !== view.decided[n]);
    const what = corrected.length
      ? `Corrected: ${corrected.map((n) => `${n ? n + " " : ""}${view.decided[n]} → ${view.picks[n]}`).join(", ")}.`
      : "Approved.";
    $("saved").textContent = `${what} ${said}`; $("saved").hidden = false;
    try { await app.updateModelContext({ content: [{ type: "text", text: `The person ${what.toLowerCase()} on ${a.model}'s decision; recorded as a precedent. ${said}` }] }); } catch {}
  } catch (e) {
    view.recorded = false; sync(); failed(e.message);
  }
}

$("approve").onclick = record;
$("correct").onclick = record;
app.ontoolinput = (params) => { view.input = params?.arguments || null; sync(); };
app.ontoolresult = (result) => {
  if (result?.isError) { failed(result.structuredContent?.error?.message || result.content?.[0]?.text || "Ada could not decide."); $("waiting").hidden = true; return; }
  view.answer = result?.structuredContent || null; view.recorded = false; $("saved").hidden = true; show();
};
app.onhostcontextchanged = theme;
app.connect().then(() => theme(app.getHostContext())).catch((e) => failed("The card could not connect: " + (e?.message || e)));
</script>
</body></html>
