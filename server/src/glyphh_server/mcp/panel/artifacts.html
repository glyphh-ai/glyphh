<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org artifacts</title>
<style>
:root{color-scheme:light dark}
body{margin:0;padding:16px;background:transparent;color:var(--color-text-primary,CanvasText);
  font-family:var(--font-sans,system-ui,sans-serif);font-size:var(--font-text-md-size,14px);line-height:var(--font-text-md-line-height,1.45)}
h1{margin:0 0 8px;font-size:var(--font-heading-sm-size,16px);font-weight:var(--font-weight-semibold,600)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:4px} .tabs button[aria-selected=true]{background:var(--color-background-primary,Canvas);font-weight:600}
input{flex:1 1 180px;font:inherit;padding:6px 10px;border-radius:var(--border-radius-md,8px);
  border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35));
  background:var(--color-background-primary,Canvas);color:inherit}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35));
  border-radius:var(--border-radius-lg,12px);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card h2{margin:0;font-size:var(--font-text-md-size,14px);font-weight:var(--font-weight-semibold,600)}
.card p{margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--color-text-secondary,GrayText);font-size:var(--font-text-sm-size,12px)}
.chips{display:flex;gap:4px;flex-wrap:wrap} .chip{font-size:var(--font-text-sm-size,12px);padding:1px 8px;border-radius:999px;
  border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
button{font:inherit;padding:4px 12px;border-radius:var(--border-radius-md,8px);cursor:pointer;
  border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35));
  background:var(--color-background-secondary,transparent);color:var(--color-text-primary,CanvasText)}
button:focus-visible,input:focus-visible{outline:2px solid var(--color-ring-primary,Highlight);outline-offset:2px}
.pages{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px}
.empty{color:var(--color-text-secondary,GrayText);padding:12px 0}
.bad{color:var(--color-text-danger,inherit)} [hidden]{display:none!important}
</style></head>
<body>
<h1>Org artifacts</h1>
<div class="bar">
  <div class="tabs" role="tablist" id="tabs" hidden>
    <button role="tab" data-state="approved" aria-selected="true">Published</button>
    <button role="tab" data-state="draft" aria-selected="false">Awaiting review</button>
    <button role="tab" data-state="rejected" aria-selected="false">Rejected</button>
  </div>
  <input id="q" type="search" placeholder="Search artifacts" aria-label="Search artifacts">
</div>
<div class="cards" id="cards"></div>
<p class="empty" id="empty" hidden></p>
<div class="pages"><button id="prev">Previous</button><span class="sub" id="where"></span><button id="next">Next</button></div>
<p class="bad" id="error" hidden></p>
<script type="module">__APP_JS__</script>
<script type="module">
const $ = (id) => document.getElementById(id);
const app = new window.McpApp({ name: "glyphh-artifacts", version: "1" }, {}, { autoResize: true });
const view = { state: "approved", q: "", page: 1, reviewer: false, total: 0, per_page: 24 };

function theme(ctx) {
  if (!ctx) return;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(ctx.styles?.variables || {})) if (v) root.style.setProperty(k, v);
  if (ctx.theme) root.style.colorScheme = ctx.theme;
  const fonts = ctx.styles?.css?.fonts;
  if (fonts && !$("host-fonts")) { const s = document.createElement("style"); s.id = "host-fonts"; s.textContent = fonts; document.head.append(s); }
}

function failed(message) { $("error").textContent = message; $("error").hidden = !message; }

async function call(name, args = {}) {
  const r = await app.callServerTool({ name, arguments: args });
  if (r?.isError) throw new Error(r.structuredContent?.error?.message || r.content?.[0]?.text || `${name} failed`);
  return r?.structuredContent || {};
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function card(a) {
  const c = el("div", "card");
  c.append(el("h2", "", a.title), el("p", "", a.description || "No description."));
  const by = a.submitted_by ? (a.submitted_by.name || a.submitted_by.email) : "a deploy";
  c.append(el("div", "sub", `${a.runtime_name} · v${a.version} · published by ${by} · ${a.submitted_at.slice(0, 10)}`));
  const chips = el("div", "chips");
  for (const r of a.roles.length ? a.roles : ["Everyone"]) chips.append(el("span", "chip", r));
  c.append(chips);
  if (a.state === "rejected" && a.reason) c.append(el("div", "sub", `Rejected: ${a.reason}`));
  const row = el("div", "row");
  const open = el("button", "", "Open"); open.onclick = () => app.openLink({ url: a.url }); row.append(open);
  if (view.reviewer && a.state === "draft") {
    const ok = el("button", "", "Approve"); ok.onclick = () => act("artifact_approve", { artifact_id: a.id }); row.append(ok);
    const no = el("button", "", "Reject"); no.onclick = () => { const reason = prompt("Why is it rejected?"); if (reason) act("artifact_reject", { artifact_id: a.id, reason }); }; row.append(no);
  }
  if (view.reviewer && a.state === "approved") {
    const off = el("button", "", "Retire"); off.onclick = () => { if (confirm(`Retire ${a.title}?`)) act("artifact_retire", { artifact_id: a.id }); }; row.append(off);
  }
  c.append(row);
  return c;
}

function show(page) {
  view.total = page.total; view.per_page = page.per_page;
  $("cards").replaceChildren(...page.artifacts.map(card));
  const none = page.artifacts.length === 0;
  $("empty").hidden = !none;
  $("empty").textContent = view.q ? "Nothing matches." : view.state === "approved" ? "Nothing published yet. Ask Claude to publish an artifact to your org." : `Nothing ${view.state === "draft" ? "awaiting review" : view.state}.`;
  const last = Math.max(1, Math.ceil(page.total / page.per_page));
  $("where").textContent = `${page.total} · page ${page.page} of ${last}`;
  $("prev").disabled = page.page <= 1; $("next").disabled = page.page >= last;
}

async function refresh() {
  try { show(await call("artifacts", { q: view.q || undefined, page: view.page, state: view.state })); failed(""); }
  catch (e) { failed(e.message); }
}

async function act(name, args) { try { await call(name, args); await refresh(); } catch (e) { failed(e.message); } }

for (const tab of $("tabs").querySelectorAll("button")) tab.onclick = () => {
  for (const t of $("tabs").querySelectorAll("button")) t.setAttribute("aria-selected", String(t === tab));
  view.state = tab.dataset.state; view.page = 1; refresh();
};
let typing;
$("q").oninput = () => { clearTimeout(typing); typing = setTimeout(() => { view.q = $("q").value.trim(); view.page = 1; refresh(); }, 300); };
$("prev").onclick = () => { view.page = Math.max(1, view.page - 1); refresh(); };
$("next").onclick = () => { view.page += 1; refresh(); };
app.ontoolresult = () => refresh();
app.onhostcontextchanged = theme;
app.connect().then(async () => {
  theme(app.getHostContext());
  try { const w = await call("whoami"); view.reviewer = w.reviewer === true; $("tabs").hidden = !view.reviewer; } catch (e) { failed(e.message); }
  return refresh();
}).catch((e) => failed("The panel could not connect: " + (e?.message || e)));
</script>
</body></html>
