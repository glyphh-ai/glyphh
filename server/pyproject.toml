[project]
name = "glyphh-server"
version = "0.1.0"
description = "The Glyphh server: accounts, orgs, invites, plans and billing, installs, licences for local rrotors, the connector and Ada Cloud"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "cryptography>=44",
    "python-multipart>=0.0.20",
    "redis>=5.2",
    # Ada Cloud's kernel (docs/specs/ada-cloud.md, 3.2): the private ada-private repo at a pinned commit, never
    # published. CI and Fly's builder read it with a read-only deploy key (the Dockerfile's ada_deploy_key secret).
    "glyphh-kernel[postgres] @ git+https://github.com/glyphh-ai/ada-private@f28212c414a7ce031cdb5253f5c4e2258141401d",
    "anthropic>=2.12.0",
    # The hosted bots run the SDK's own bot loop (glyphh.bots, docs/specs/bots.md, 9)
    "glyphh[api]==3.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "asgi-lifespan>=2.1.0",
    "httpx-ws>=0.9.0",
    "jsonschema>=4.23",
]
docs = [
    "mkdocs-material>=9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the kernel, from its private repo at a pinned commit

[tool.hatch.build.targets.wheel]
packages = ["src/glyphh_server", "src/glyphh_ada"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=glyphh_server --cov=glyphh_ada --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["glyphh_server", "glyphh_ada"]
# SQLAlchemy's async engine switches greenlets; without this, lines resumed after one go unseen.
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "SIM", "RUF"]
