name: glyphh

services:
  # Postgres 17. Nothing needs pgvector any more (it was Ada Cloud's); its image is kept so a dev volume from before
  # the clean-up, whose database still has the extension and Ada's schemas, opens as it is.
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: glyphh
      POSTGRES_PASSWORD: glyphh
      POSTGRES_DB: glyphh
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glyphh -d glyphh"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The request metrics, the tick's heartbeat and ops events on their way to Postgres: nothing kept, so nothing saved.
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      GLYPHH_DATABASE_URL: postgresql+asyncpg://glyphh:glyphh@db:5432/glyphh
      GLYPHH_REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The platform (glyphh-ai/platform, checked out beside this repo): every page a person sees, on :5173.
  # Its settings, including its OAuth client at this server, are in ../platform/.env.docker.
  platform:
    build:
      context: ../platform
    env_file:
      - path: ../platform/.env.docker
        required: true
    ports:
      - "5173:5173"
    depends_on:
      - server

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      GLYPHH_ENV: test
      GLYPHH_DATABASE_URL: postgresql+asyncpg://glyphh:glyphh@db:5432/glyphh_test
      GLYPHH_SECRET_KEY: test-secret-key-that-signs-sign-in-links-0123456789
      GLYPHH_REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db:
