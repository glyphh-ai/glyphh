# The Glyphh server on Fly: the app glyphh-ai-server, at https://api.glyphh.ai.
# Deployed only by CI, on a merge to main (.github/workflows/ci.yml). Its secrets are the app's own, every one a
# GLYPHH_ setting (README, the settings table): GLYPHH_DATABASE_URL (`fly mpg attach`), GLYPHH_REDIS_URL,
# GLYPHH_SECRET_KEY, GLYPHH_LICENSE_KEY, GLYPHH_STRIPE_SECRET_KEY, GLYPHH_STRIPE_WEBHOOK_SECRET, and the sign-in
# providers and Fly hosting ones as they are added.
app = "glyphh-ai-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"

[env]
  GLYPHH_ENV = "prod"
  GLYPHH_PUBLIC_URL = "https://api.glyphh.ai"
  GLYPHH_PLATFORM_URL = "https://platform.glyphh.ai"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
