# The Glyphh server on Fly: the app glyphh-ai-server, at https://api.glyphh.ai.
# Deployed only by CI, on a merge to main (.github/workflows/ci.yml). Its secrets are the app's own, every one a
# GLYPHH_ setting (docs/architecture.md, Settings): GLYPHH_DATABASE_URL (`fly mpg attach`), GLYPHH_REDIS_URL,
# GLYPHH_SECRET_KEY, GLYPHH_PLATFORM_CLIENT_ID and _SECRET, the sign-in providers' (GLYPHH_GOOGLE_*, GLYPHH_GITHUB_*),
# GLYPHH_STRIPE_SECRET_KEY and GLYPHH_STRIPE_WEBHOOK_SECRET, GLYPHH_STAFF_EMAILS, GLYPHH_CLOUDFLARE_API_TOKEN.
# Glyphh's products were retired on 2026-11-18: one process group is left. The secrets no setting reads any more
# are listed in scripts/wind-down/README.md, to unset once this is deployed.
app = "glyphh-ai-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"

[env]
  GLYPHH_ENV = "prod"
  GLYPHH_PUBLIC_URL = "https://api.glyphh.ai"
  GLYPHH_PLATFORM_URL = "https://platform.glyphh.ai"

[processes]
  app = "sh -c 'python -m glyphh_server.db.schema && exec uvicorn glyphh_server.main:app --host 0.0.0.0 --port 8080'"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "1024mb"
