site_name: Glyphh
docs_dir: docs
nav:
  - Glyphh: architecture.md
  - Pricing: pricing.md
  - "Plan: Ada Cloud": specs/ada-cloud.md
  - "Plan: hosted-model tokens": specs/tokens.md
theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: purple
  features:
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
