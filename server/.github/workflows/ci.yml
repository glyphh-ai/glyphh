name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: docker compose --profile test run --rm --build test

  image:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          build-args: GLYPHH_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/glyphh-ai/server:${{ github.sha }}
            ghcr.io/glyphh-ai/server:main

  # A merge to main deploys that commit to Fly (glyphh-ai-server, api.glyphh.ai) with the FLY_API_TOKEN secret: the
  # only way the server reaches production. The image's own start command runs the schema step, then the server.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Deploy to glyphh-ai-server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --build-arg GLYPHH_VERSION=${{ github.sha }} --wait-timeout 300
      - name: The server answers, at this commit
        run: |
          curl -sf https://api.glyphh.ai/v1/health | tee health.json
          python3 -c "import json,sys; h=json.load(open('health.json')); sys.exit(0 if h['version']=='${{ github.sha }}' and h['database'] and h['redis'] else 1)"
