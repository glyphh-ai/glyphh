<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glyphh sign-in</title>
<style>
:root{color-scheme:light dark}
body{margin:0;padding:16px;background:transparent;color:var(--color-text-primary,CanvasText);
  font-family:var(--font-sans,system-ui,sans-serif);font-size:var(--font-text-md-size,14px);line-height:var(--font-text-md-line-height,1.45)}
.card{border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35));
  border-radius:var(--border-radius-lg,12px);padding:16px;background:var(--color-background-primary,transparent)}
h1{margin:0 0 4px;font-size:var(--font-heading-sm-size,16px);font-weight:var(--font-weight-semibold,600)}
.sub{margin:0;color:var(--color-text-secondary,GrayText)}
.code{margin:14px 0;font-family:var(--font-mono,ui-monospace,monospace);font-size:var(--font-heading-xl-size,28px);
  font-weight:var(--font-weight-bold,700);letter-spacing:.12em;user-select:all}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;padding:6px 14px;border-radius:var(--border-radius-md,8px);cursor:pointer;
  border:var(--border-width-regular,1px) solid var(--color-border-primary,rgba(128,128,128,.35));
  background:var(--color-background-secondary,transparent);color:var(--color-text-primary,CanvasText)}
button.primary{background:var(--color-background-inverse,#222);color:var(--color-text-inverse,#fff);border-color:transparent}
button:focus-visible{outline:2px solid var(--color-ring-primary,Highlight);outline-offset:2px}
.link{margin-top:10px;font-size:var(--font-text-sm-size,12px);color:var(--color-text-tertiary,GrayText);word-break:break-all}
.ok{color:var(--color-text-success,inherit)} .bad{color:var(--color-text-danger,inherit)}
[hidden]{display:none!important}
</style></head>
<body>
<div class="card">
  <h1>Sign in to Glyphh</h1>
  <p class="sub" id="say">Getting a sign-in code…</p>
  <div id="pending" hidden>
    <div class="code" id="code"></div>
    <div class="row">
      <button class="primary" id="open">Sign in</button>
      <span class="sub" id="wait">Approve this code on the page that opens.</span>
    </div>
    <div class="link" id="link"></div>
  </div>
  <div class="row" id="again" hidden><button id="restart">Start again</button></div>
</div>
<script type="module">__APP_JS__</script>
<script type="module">
const $ = (id) => document.getElementById(id);
const app = new window.McpApp({ name: "glyphh-sign-in", version: "1" }, {}, { autoResize: true });
let card = null, timer = null;

function theme(ctx) {
  if (!ctx) return;
  const root = document.documentElement;
  for (const [k, v] of Object.entries(ctx.styles?.variables || {})) if (v) root.style.setProperty(k, v);
  if (ctx.theme) root.style.colorScheme = ctx.theme;
  const fonts = ctx.styles?.css?.fonts;
  if (fonts && !$("host-fonts")) { const s = document.createElement("style"); s.id = "host-fonts"; s.textContent = fonts; document.head.append(s); }
}

function stop() { if (timer) clearInterval(timer); timer = null; }

function ended(text, cls) {
  stop();
  $("pending").hidden = true;
  $("say").textContent = text;
  $("say").className = "sub " + (cls || "");
  $("again").hidden = cls === "ok";
}

function show(c) {
  card = c;
  if (!c || !c.state) return ended("No sign-in to show.", "bad");
  if (c.state === "signed_in") return ended(`Signed in as ${c.email}. You're all set.`, "ok");
  $("say").textContent = "Your sign-in code:";
  $("say").className = "sub";
  $("code").textContent = c.user_code;
  const a = document.createElement("a");
  a.href = c.verification_uri_complete; a.target = "_blank"; a.rel = "noopener";
  a.textContent = c.verification_uri_complete;
  $("link").replaceChildren(a);
  $("pending").hidden = false;
  $("again").hidden = true;
  stop();
  timer = setInterval(poll, 3000);
}

async function poll() {
  if (card?.expires_at && Date.now() >= card.expires_at) return ended("The code expired.", "bad");
  let s;
  try { s = (await app.callServerTool({ name: "glyphh_sign_in_status", arguments: {} }))?.structuredContent; }
  catch { return; } // try again on the next tick
  if (!s || s.status === "pending") return;
  if (s.status === "signed_in") return ended(`Signed in as ${s.email}. You're all set.`, "ok");
  if (s.status === "denied") return ended("Sign-in was declined.", "bad");
  if (s.status === "expired") return ended("The code expired.", "bad");
  ended(s.message || "The sign-in failed.", "bad");
}

$("open").onclick = async () => {
  if (!card?.verification_uri_complete) return;
  // Claude opens the page in its browser pane when asked in the chat; the card
  // cannot open it itself, so the button asks.
  let asked = false;
  try {
    const r = await app.sendMessage({ role: "user", content: [{ type: "text",
      text: `/glyphh open ${card.verification_uri_complete}` }] });
    asked = !r?.isError;
  } catch {}
  $("wait").textContent = asked ? "Opening the sign-in page… approve it there." : "Click the link below to approve, then come back.";
};

$("restart").onclick = async () => {
  $("again").hidden = true;
  $("say").textContent = "Getting a sign-in code…";
  $("say").className = "sub";
  try {
    const r = await app.callServerTool({ name: "glyphh_sign_in", arguments: {} });
    if (r?.isError) return ended(r.content?.[0]?.text || "Could not start a sign-in.", "bad");
    show(r?.structuredContent);
  } catch (e) { ended("Could not start a sign-in: " + (e?.message || e), "bad"); }
};

app.ontoolresult = (r) => {
  if (r?.isError) return ended(r.content?.[0]?.text || "Could not start a sign-in.", "bad");
  show(r?.structuredContent);
};
app.onhostcontextchanged = theme;
app.connect().then(() => theme(app.getHostContext())).catch((e) => ended("The card could not connect: " + (e?.message || e), "bad"));
</script>
</body></html>
