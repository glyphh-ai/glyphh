[project]
name = "glyphh"
version = "0.1.0"
description = "The Glyphh SDK for Python"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "attrs>=23.2",
    "python-dateutil>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyphh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=glyphh --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = ["*/glyphh/_gen/*"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/glyphh/_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "SIM", "RUF"]
