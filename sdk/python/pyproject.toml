[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "glyphh"
version = "3.5.0"
description = "Ada for Python and the glyphh command: typed decisions from your own precedents, from Ada Cloud (https://ada.glyphh.ai) with an API key or a Glyphh sign-in."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Glyphh AI" }]
keywords = ["glyphh", "ada", "typed", "deterministic", "precedent", "decision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
glyphh = "glyphh.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://glyphh.ai"
Source = "https://github.com/glyphh-ai/glyphh"
Changelog = "https://github.com/glyphh-ai/glyphh/blob/main/sdk/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/glyphh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
