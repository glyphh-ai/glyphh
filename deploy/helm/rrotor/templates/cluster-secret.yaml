{{- if and .Values.cluster.enabled (not .Values.cluster.existingSecret) }}
{{- $name := include "rrotor.clusterSecretName" . }}
{{- $secret := .Values.cluster.secret }}
{{- if not $secret }}
{{- /* Made once, on install (32 random bytes' worth, base64), and kept: an upgrade reads it back. */}}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $old $old.data (hasKey $old.data "RROTOR_CLUSTER_SECRET") }}
{{- $secret = index $old.data "RROTOR_CLUSTER_SECRET" | b64dec }}
{{- else }}
{{- $secret = randAlphaNum 48 | b64enc }}
{{- end }}
{{- end }}
# The cluster secret: every node derives the cluster's mutual TLS from it. Anyone with it can join (up to the key's
# max_nodes): keep it as the runtime token is kept. Kept when the release is uninstalled.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rrotor.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  RROTOR_CLUSTER_SECRET: {{ $secret | quote }}
  {{- with .Values.cluster.secretPrevious }}
  RROTOR_CLUSTER_SECRET_PREVIOUS: {{ . | quote }}
  {{- end }}
{{- end }}
