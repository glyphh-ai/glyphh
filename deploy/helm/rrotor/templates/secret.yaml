{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rrotor.fullname" . }}
  labels:
    {{- include "rrotor.labels" . | nindent 4 }}
type: Opaque
stringData:
  RROTOR_RUNTIME_ID: {{ required "runtime.id is required (or name a Secret in existingSecret)" .Values.runtime.id | quote }}
  RROTOR_RUNTIME_TOKEN: {{ required "runtime.token is required (or name a Secret in existingSecret)" .Values.runtime.token | quote }}
  {{- with (.Values.runtime.licenseKey | default .Values.runtime.licence) }}
  GLYPHH_LICENSE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.drain.headers }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ . | quote }}
  {{- end }}
{{- end }}
