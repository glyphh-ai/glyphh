{{- if and .Values.cluster.enabled .Values.cluster.networkPolicy.enabled }}
# The cluster's port between this release's pods only; the API's port from anywhere (the Ingress controller, your
# load balancer). Nothing else reaches the pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rrotor.fullname" . }}
  labels:
    {{- include "rrotor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rrotor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "rrotor.selectorLabels" . | nindent 14 }}
      ports:
        - port: cluster
          protocol: TCP
{{- end }}
