{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rrotor.serviceAccountName" . }}
  labels:
    {{- include "rrotor.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# rrotor calls no Kubernetes API.
automountServiceAccountToken: false
{{- end }}
