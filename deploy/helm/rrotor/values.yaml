# rrotor on Kubernetes: one rrotor per release, a StatefulSet with a volume for /data per pod. With the cluster off
# (the default) it is one replica, one box; with cluster.enabled, `replicas` nodes of one runtime that sync, behind
# the one Service and Ingress (https://docs.glyphh.ai/helm).

image:
  repository: ghcr.io/glyphh-ai/rrotor
  # Defaults to the chart's appVersion. Pin a release in production.
  tag: ""
  pullPolicy: IfNotPresent
pullSecrets: []

# The exact public host rrotor answers at (required), e.g. rrotor.acme.com. The Ingress serves it; rrotor's gate
# refuses any other Host.
publicHost: ""

# The Glyphh server.
server: https://api.glyphh.ai

# "off" for an air-gapped rrotor: no link, no heartbeat, it runs on its licence key alone.
link: "on"

# The runtime, from registering it on the platform (the token is shown once). Either fill these in and the chart
# makes the Secret, or name a Secret you made yourself in existingSecret, with the keys RROTOR_RUNTIME_ID,
# RROTOR_RUNTIME_TOKEN and, optionally, GLYPHH_LICENSE_KEY (RROTOR_LICENCE is still read).
runtime:
  id: ""
  token: ""
  # The licence key, optional: normally it arrives over the link or the heartbeat; set it for an air-gapped rrotor.
  # Without one rrotor runs at Community's limits. Goes into the Secret as GLYPHH_LICENSE_KEY.
  licenseKey: ""
  # Deprecated alias of licenseKey (an earlier release's offline licence), used when licenseKey is empty.
  licence: ""
  # Air-gapped: the SHA-256 of each runtime key that may call it (printf %s "$KEY" | sha256sum). With the link on, the
  # keys come down the link instead. Not secret: hashes only.
  keysSha256: []
existingSecret: ""

# Where rrotor's logs, metrics, traces and audit events go. By default nowhere but here: its JSON log lines on stdout
# (the kubelet rotates them) and, on Enterprise, its audit log on its volume (/data/audit).
drain:
  # Your OpenTelemetry collector, OTLP over HTTP with protobuf (OTEL_EXPORTER_OTLP_ENDPOINT), e.g.
  # http://otel-collector.observability:4318. Empty: no drain. gRPC is not offered: a collector forwards it.
  endpoint: ""
  # OTEL_EXPORTER_OTLP_HEADERS (key=value,...), e.g. a backend's API key. Kept in the Secret (or set the key
  # OTEL_EXPORTER_OTLP_HEADERS in your existingSecret).
  headers: ""
  # OTEL_RESOURCE_ATTRIBUTES and OTEL_SERVICE_NAME (default rrotor); empty: not set.
  resourceAttributes: ""
  serviceName: ""
  # OTEL_TRACES_SAMPLER (default parentbased_always_on) and OTEL_TRACES_SAMPLER_ARG; empty: not set. Other OTEL_*
  # variables (a CA certificate, a timeout) go in extraEnv.
  tracesSampler: ""
  tracesSamplerArg: ""
  # What the drain sends (RROTOR_DRAIN_SIGNALS), and the records per signal held while the collector is down, the
  # oldest dropped past it (RROTOR_DRAIN_BUFFER). Audit events are never dropped: they wait on disk.
  signals: logs,metrics,traces,audit
  buffer: 10000
  # In a cluster (RROTOR_DRAIN_AT): head, the followers' signals go by the head, which exports for every node (one
  # egress, from the head); node, each pod exports itself.
  at: head
  # "on": programs' and CLI commands' inputs and results in your drain too, 4 KB each (RROTOR_LOG_PAYLOADS), never
  # anywhere else.
  payloads: "off"

# "on": the same logs, metrics, traces and audit events also go to Glyphh (RROTOR_SERVER_LOGS), so the platform can
# show them. They then leave your cluster (never inputs, results or callers' addresses). Not with link "off".
serverLogs: "off"

# Enterprise: days of audit log kept, and the most it may take on the volume, the oldest day deleted first.
audit:
  retentionDays: 90
  maxMb: 1024

# A cluster (https://docs.glyphh.ai/helm, "A cluster"): needs a licence key with cluster sync, and at most its
# max_nodes replicas (rrotor refuses the rest; the chart does not know the key).
cluster:
  enabled: false
  # The cluster secret (RROTOR_CLUSTER_SECRET): 32 or more random bytes, base64 (openssl rand -base64 32). Empty:
  # the chart makes one on install and keeps it on upgrades. Or name a Secret you made in existingSecret, with the
  # key RROTOR_CLUSTER_SECRET (and RROTOR_CLUSTER_SECRET_PREVIOUS while a new one rolls out).
  secret: ""
  # The old secret, trusted too while a new one rolls out (RROTOR_CLUSTER_SECRET_PREVIOUS).
  secretPrevious: ""
  existingSecret: ""
  # The node that makes the cluster the first time (RROTOR_CLUSTER_HEAD). Empty: the first pod, <name>-0.
  head: ""
  # A member unseen this long is removed by the head (RROTOR_CLUSTER_EVICT_AFTER), and the replication log kept for
  # catch-up (RROTOR_CLUSTER_LOG_KEEP). Empty: rrotor's defaults, 24h and 1g.
  evictAfter: ""
  logKeep: ""
  # The cluster's port, node to node only: on the headless Service, never on the Service or the Ingress.
  port: 7778
  # Kubernetes' DNS domain, for the headless Service's name (RROTOR_CLUSTER_DNS).
  clusterDomain: cluster.local
  # Allow the cluster's port between this release's pods only, and the API's port from anywhere. Needs a CNI that
  # enforces NetworkPolicy.
  networkPolicy:
    enabled: true
  # Spread the pods across nodes and zones (preferred, so a smaller cluster still schedules). Ignored when affinity
  # is set.
  antiAffinity: true

# The nodes, with cluster.enabled. Empty: 3. Without the cluster, always one.
replicas: ""

# small: shared 1 CPU, 1 GiB, 3 GiB disk; medium: 2 CPU, 4 GiB, 10 GiB; large: 2 CPU, 8 GiB, 20 GiB.
size: small
# Set to override the preset's requests and limits.
resources: {}

persistence:
  # Empty uses the cluster's default storage class.
  storageClass: ""
  # Empty uses the preset's size.
  size: ""
  accessModes:
    - ReadWriteOnce

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations: {}
  # Set to a cert-manager ClusterIssuer (e.g. letsencrypt) to have cert-manager issue the TLS certificate.
  certManagerClusterIssuer: ""
  tls:
    enabled: true
    # Defaults to <release>-rrotor-tls. With cert-manager it is made for you; without, make it yourself.
    secretName: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

# One replica: off by default, since minAvailable 1 stops node drains until you move rrotor yourself; turn it on to
# keep a drain from stopping rrotor mid-run. A cluster: on whatever this says, maxUnavailable 1.
podDisruptionBudget:
  enabled: false

# The program sandbox (bubblewrap) makes namespaces and mounts /proc. That needs seccomp and AppArmor unconfined and
# /proc unmasked, and an unmasked /proc needs the pod in its own user namespace (hostUsers: false). rrotor's own
# seccomp filter and Landlock hold each run.
hostUsers: false
podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  seccompProfile:
    type: Unconfined
  appArmorProfile:
    type: Unconfined
  procMount: Unmasked
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 60
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 30
  timeoutSeconds: 3
# /readyz: 200 while this node may take traffic (standalone and up, or a member in step with the head).
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 10
  timeoutSeconds: 3

# More environment for rrotor, e.g. RROTOR_LOG_LEVEL.
extraEnv: []

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
