# A three-node cluster with its secrets made outside the chart, a set head, the defaults' tuning, its own affinity,
# and no NetworkPolicy.
publicHost: rrotor.example.com
existingSecret: rrotor-runtime
cluster:
  enabled: true
  existingSecret: rrotor-cluster
  head: rrotor-1
  evictAfter: 12h
  logKeep: 2g
  networkPolicy:
    enabled: false
replicas: 3
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: rrotor.example.com/pool
              operator: In
              values: ["rrotor"]
