# The air-gapped variant, laid over docker-compose.yml (https://docs.glyphh.ai/docker-compose, "Air-gapped"):
#   docker compose -f docker-compose.yml -f docker-compose.airgap.yml up -d
# No link and no heartbeat: rrotor runs on its licence key alone (GLYPHH_LICENSE_KEY in .env, or /data/licence.token),
# and Caddy serves your own certificate from ./certs.
services:
  rrotor:
    environment:
      RROTOR_LINK: "off"
      GLYPHH_LICENSE_KEY: ${GLYPHH_LICENSE_KEY:-${RROTOR_LICENCE:-}}  # set it in .env: without a key an air-gapped rrotor runs as Community

  caddy:
    volumes:
      - ./Caddyfile.airgap:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
